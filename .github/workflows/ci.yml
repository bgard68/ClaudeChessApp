# The publish gate on every pull request: scripts/test-gate.ps1 runs the
# real checks and the negative probes that prove the checks can fail.
name: CI gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Reading the code is the whole job. Stated rather than inherited: the
# repository default is read-only today, but a default is a setting someone
# can change, and a gate that runs on pull requests should not silently widen
# with it.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the job token has no use after the clone.
          persist-credentials: false
          # gitleaks scans the whole history, so the whole history must be here.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # Installed from the lock, never re-resolved. What runs here is the
      # tree that was reviewed, not whatever npm happened to pick this
      # minute. The lock now carries every platform's optional binaries, so
      # the Linux runner finds the bindings a Windows-written one omitted
      # (npm/cli#4828) -- regenerate it with `npm install --package-lock-only`
      # and no node_modules present, or those entries come back pruned.
      - run: npm ci --no-audit --no-fund

      # Downloaded, verified, then extracted — in that order. Piping the
      # download straight into tar cannot check anything, because the archive
      # is unpacked as it arrives: by the time a hash could be computed the
      # binary is already on PATH, root-owned, about to run against the repo.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks
          rm "$archive"

      - run: pwsh scripts/test-gate.ps1

      # The dependency rules the hand-rolled architecture test cannot see:
      # cycles, test code reached from shipped code, imports that resolve to
      # nothing. Which rules and why: .dependency-cruiser.mjs. The count check
      # is the vacuity guard — without a working TypeScript parser
      # dependency-cruiser finds 0 modules and still exits 0, a verdict on an
      # empty graph, which is exactly how it behaved against this repo's
      # TypeScript 7 until the config switched the parser to swc.
      - name: Architecture rules
        run: |
          npm run depcruise 2>&1 | tee "$RUNNER_TEMP/depcruise.out"
          test "${PIPESTATUS[0]}" -eq 0
          grep -qE '\([1-9][0-9]* modules' "$RUNNER_TEMP/depcruise.out"

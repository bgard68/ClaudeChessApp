# The publish gate on every pull request: scripts/test-gate.ps1 runs the
# real checks and the negative probes that prove the checks can fail.
name: CI gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Reading the code is the whole job. Stated rather than inherited: the
# repository default is read-only today, but a default is a setting someone
# can change, and a gate that runs on pull requests should not silently widen
# with it.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the whole history, so the whole history must be here.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A lock written on Windows omits other platforms' native bindings
      # (npm/cli#4828) - npm ci refuses it, and npm install trusts the
      # omission and skips them too. CI resolves fresh from package.json;
      # every gate that follows validates what that produced.
      - run: rm package-lock.json
      - run: npm install --no-audit --no-fund

      # Downloaded, verified, then extracted — in that order. Piping the
      # download straight into tar cannot check anything, because the archive
      # is unpacked as it arrives: by the time a hash could be computed the
      # binary is already on PATH, root-owned, about to run against the repo.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks
          rm "$archive"

      - run: pwsh scripts/test-gate.ps1

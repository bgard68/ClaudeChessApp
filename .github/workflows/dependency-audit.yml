name: Dependency audit

# "What is our exposure today?" — asked about the repository, on a schedule,
# against main.
#
# That is a different question from "does this change add risk?", and the two
# belong in different places. The publish gate used to ask both on every pull
# request, which made every branch answerable for the state of the branch it
# came from. Dependabot #81 is the worked example: the gate went red over
# `source-map-js`, a package that PR does not touch and could not fix, native
# auto-merge correctly declined to merge a red branch, and every other
# dependency update queued behind it for a day. A gate that fails for a reason
# its author cannot act on is not strict, it is stuck.
#
# So the gate keeps what it can fairly ask of a branch — production advisories
# block, because those ship — and the absolute question moved here, where the
# answer is about us rather than about somebody's branch.
#
# This job FAILS and opens an ISSUE rather than only failing. A development
# advisory does not reach a user, but a development dependency that is
# compromised rather than merely buggy can inject into what we ship, which is
# the whole subject of SUPPLY-CHAIN.md. That answer needs an owner, and a red
# scheduled run with no issue attached is the easiest thing in a repository to
# never look at.
#
# Daily, because an advisory appears when the ADVISORY is published, not when
# this code changes — there is no commit to hang it on.

on:
  schedule:
    # 07:10 UTC, off the hour because the hour is when everything else runs.
    - cron: '10 7 * * *'
  # So a fix can be confirmed without waiting a day.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit the dependency tree on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To file and update the issue this job exists to raise.
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          # Nothing here pushes, so the job token has no use after the clone.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # No install: `npm audit` resolves advisories against the tree the lock
      # describes, which is the tree that would ship.
      - name: Audit the whole tree
        id: audit
        run: |
          # `|| true` on purpose. A non-zero exit here is the normal result when
          # there is something to report, and the job needs to get as far as
          # filing the issue before it fails. The failure is asserted at the end.
          npm audit --audit-level=moderate > audit.txt 2>&1 || true
          cat audit.txt
          if grep -q 'found 0 vulnerabilities' audit.txt; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      # Which half matters: production advisories should already have been
      # stopped at the gate, so one reaching main is worse news than a
      # development one and the issue says so.
      - name: Audit production dependencies only
        id: prod
        run: |
          npm audit --omit=dev --audit-level=moderate > audit-prod.txt 2>&1 || true
          cat audit-prod.txt
          if grep -q 'found 0 vulnerabilities' audit-prod.txt; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.audit.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_CLEAN: ${{ steps.prod.outputs.clean }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Dependency advisories on main'

          {
            if [ "$PROD_CLEAN" = 'false' ]; then
              echo '**Production dependencies are affected.** These ship to users, and the'
              echo 'publish gate blocks on them — so one reaching `main` means it arrived by'
              echo 'a route that does not pass the gate. Treat as urgent.'
            else
              echo '**Development dependencies only.** Nothing here reaches a user: these are'
              echo 'build and test tooling. Not urgent, and deliberately not blocking anyone'
              echo 'pull request — but not nothing either, because a compromised build'
              echo 'dependency can inject into what we ship.'
            fi
            echo
            echo '```'
            cat audit.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
            echo
            echo 'Fix: `npm update <package> --package-lock-only` in a directory with no'
            echo '`node_modules` present, or an `overrides` entry when the parents'"'"' ranges'
            echo 'will not allow the fixed version. See the lock-file rules in CLAUDE.md.'
            echo
            echo 'This issue is updated by a comment each day the advisory persists, and is'
            echo 'closed automatically on the first clean run.'
          } > body.md

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)

          if [ -n "$EXISTING" ]; then
            echo "Updating issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      # Closed on the first clean run, so the issue tracks the current state
      # rather than becoming a log of everything that was ever true.
      - name: Close the tracking issue once the tree is clean
        if: steps.audit.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE='Dependency advisories on main'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment 'Clean audit — closing. Reopened automatically if it returns.'
          else
            echo 'Nothing to close.'
          fi

      # Last, so the issue is filed before the run goes red.
      - name: Fail if anything is vulnerable
        if: steps.audit.outputs.clean == 'false'
        run: |
          echo 'Advisories found — see the tracking issue.'
          exit 1

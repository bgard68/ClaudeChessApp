# Builds and deploys to Azure Static Web Apps on every push to main.
# One-time setup and the reasoning live in docs/DEPLOYMENT.md.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Step-level `if` may not read the secrets context directly — the run
      # that taught us died in zero seconds — so the check rides through env.
      HAS_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate's gitleaks scan covers the whole history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lock was written by npm 11; the runner's npm 10 resolves optional
      # platform packages differently and rejects it. Same npm, same answer.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # The full publish gate: typecheck, tests, audit, gitleaks, the
      # production build, a smoke test that plays the built app against the
      # bundled engine — and the probes proving the checks can actually fail.
      - run: pwsh scripts/test-gate.ps1

      # Skipped until the Azure resource exists and its token is stored;
      # the gate and the build above still guard every push meanwhile.
      - uses: Azure/static-web-apps-deploy@v1
        if: env.HAS_DEPLOY_TOKEN == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

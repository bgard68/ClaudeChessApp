# Builds and deploys to Azure Static Web Apps on every push to main.
# One-time setup and the reasoning live in docs/DEPLOYMENT.md.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy authenticates to Azure with its own token, so GITHUB_TOKEN needs
# nothing beyond reading the code. Stated rather than inherited, as in ci.yml.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Step-level `if` may not read the secrets context directly — the run
      # that taught us died in zero seconds — so the check rides through env.
      HAS_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The gate's gitleaks scan covers the whole history.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # A lock written on Windows omits other platforms' native bindings
      # (npm/cli#4828) - npm ci refuses it, and npm install trusts the
      # omission and skips them too. CI resolves fresh from package.json;
      # every gate that follows validates what that produced.
      - run: rm package-lock.json
      - run: npm install --no-audit --no-fund

      # Downloaded, verified, then extracted — in that order. Piping the
      # download straight into tar cannot check anything, because the archive
      # is unpacked as it arrives. This job goes on to hold the deploy token,
      # so an unverified root-owned binary here reaches production.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks
          rm "$archive"

      # The full publish gate: typecheck, tests, audit, gitleaks, the
      # production build, a smoke test that plays the built app against the
      # bundled engine — and the probes proving the checks can actually fail.
      - run: pwsh scripts/test-gate.ps1

      # Skipped until the Azure resource exists and its token is stored;
      # the gate and the build above still guard every push meanwhile.
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        if: env.HAS_DEPLOY_TOKEN == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

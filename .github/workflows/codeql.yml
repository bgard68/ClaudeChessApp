# CodeQL static analysis on pushes, pull requests, and a weekly sweep.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 7 * * 1'

# Read-only at the workflow level: only the analyze job below escalates, and
# only to the one scope uploading its results requires.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # A JavaScript/TypeScript analysis of this repository takes a few minutes;
    # the cap stops a wedged run from holding the runner for hours.
    timeout-minutes: 20
    permissions:
      # security-events: write is what uploads the SARIF results — CodeQL
      # cannot report findings without it, so this is the floor, not a widen.
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the job token has no use after the clone.
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: '/language:javascript-typescript'
